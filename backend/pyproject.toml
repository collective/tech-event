[project]
name = "collective.techevent"
dynamic = ["version"]
description = "Support for implementing tech conference in a Plone site."
readme = "README.md"
license = "GPL-2.0-only"
# plonegovbr.socialmedia 3.x requires Python 3.11 or later, so this package
# cannot be installed on 3.10 once it depends on that release.
requires-python = ">=3.11"
authors = [
    { name = "PloneGov-BR", email = "gov@plone.org.br" },
]
keywords = [
    "CMS",
    "Plone",
    "Python",
    "Conference",
    "Event",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Plone",
    "Framework :: Plone :: 6.1",
    "Framework :: Plone :: 6.2",
    "Framework :: Plone :: Addon",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Products.CMFPlone",
    "plone.api",
    "plone.restapi>=9.15.2",
    "plone.volto",
    "plonegovbr.socialmedia>=3.0.0",
    "collective.z3cform.datagridfield",
]

[project.optional-dependencies]
test = [
    "horse-with-no-namespace",
    "mypy",
    "plone.app.testing",
    "plone.restapi[test]",
    "pytest>=8.0.0",
    "pytest-cov",
    "pytest-plone>=1.1.0",
]
users = [
    "Products.membrane",
    "pyotp",
]

[project.urls]
Homepage = "https://github.com/collective/tech-event"
PyPI = "https://pypi.org/project/collective.techevent"
Source = "https://github.com/collective/tech-event"
Tracker = "https://github.com/collective/tech-event/issues"


[project.entry-points."plone.autoinclude.plugin"]
target = "plone"

[tool.uv]
managed = false

[tool.hatch.version]
path = "src/collective/techevent/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
strict-naming = true

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
]

[tool.hatch.build.targets.wheel]
packages = ["src/collective"]

[tool.towncrier]
directory = "news/"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
template = "news/.changelog_template.jinja"
issue_format = "[#{issue}](https://github.com/collective/tech-event/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes:"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features:"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes:"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal:"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation:"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests"
showcontent = true

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
lint.select = [
    # flake8-2020
    "YTT",
    # flake8-annotations: every function in src/ is fully annotated
    "ANN",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
]
lint.ignore = [
    # DoNotAssignLambda
    "E731",
    # AnyType: Zope and Plone objects (contexts, requests, brains) are
    # untyped, so `Any` is the honest annotation for them.
    "ANN401",
]

[tool.ruff.lint.isort]
case-sensitive = false
no-sections = true
force-single-line = true
from-first = true
lines-after-imports = 2
lines-between-types = 1
order-by-type = false

[tool.ruff.format]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501", "RUF001", "S101"]
"scripts/*" = ["ANN"]

[tool.check-manifest]
ignore = [
    ".editorconfig",
    ".flake8",
    "dependabot.yml",
    "mx.ini",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["collective.techevent", "tests"]
branch = true
parallel = true
omit = [
  "src/collective/techevent/locales/*.py",
]

# Branch coverage, enforced. `make check-pragmas` keeps the few allowed
# exclusions honest.
[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.mypy]
# plone-stubs uses 3.12 syntax in its stubs; ruff's py311 target keeps
# this package's own code 3.11-compatible.
python_version = "3.12"
files = ["src"]
# Native namespace: resolve modules as collective.techevent.*, not techevent.*.
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

# zope.interface methods declare an explicit self, as plone-stubs does, and
# a docstring for a body: there is nothing to return.
[[tool.mypy.overrides]]
module = ["collective.techevent.interfaces"]
disable_error_code = ["empty-body"]
