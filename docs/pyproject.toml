[project]
name = "tech-event-docs"
description = "Documentation for Tech Event Support for Plone: a Plone add-on and a Volto add-on for tech conferences."
version = "1.0.0"
keywords = [
    "Tech Event Support for Plone",
    "documentation",
    "Plone",
    "Diátaxis",
]
readme = "README.md"
requires-python = "==3.14.*"
maintainers = [
    { name = "PloneGov-BR", email = "gov@plone.org.br" },
]
authors = [
    { name = "PloneGov-BR", email = "gov@plone.org.br" },
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "collective-techevent",
]

[dependency-groups]
dev = [
    "graphviz",
    "linkify-it-py",
    "myst-parser",
    "plone-sphinx-theme",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-examples",
    "sphinx-notfound-page",
    "sphinx-reredirects",
    "sphinx-sitemap",
    "sphinx-tippy",
    "sphinxcontrib-httpdomain",
    "sphinxcontrib-httpexample",
    "sphinxcontrib-mermaid",
    "sphinxext-opengraph",
    "vale",
]

[project.urls]
Repository = "https://github.com/collective/tech-event"
Documentation = "https://collective.github.io/tech-event/"

[tool.uv.sources]
collective-techevent = { path = "../backend/", editable = true }
